bundle:
  name: dab_poc

include:
  - resources/*.yml

# Everything not in .gitignore is synced, except what is listed here
sync:
  exclude:
    - app/**
    - tests/**
    - deploy.py
    - README.md

variables:
  catalog:
    description: Unity Catalog catalog
  schema:
    description: Schema for this project's tables

targets:
  dev:
    mode: development          # resources get a [dev <user>] prefix, schedules paused
    default: true
    workspace:
      host: https://dbc-xxxxxxxx-xxxx.cloud.databricks.com   # <-- replace
    variables:
      catalog: poc_catalog                                   # <-- replace
      schema: poc_schema                                     # <-- replace

  # Uncomment after the POC succeeds
  # prod:
  #   mode: production
  #   workspace:
  #     host: https://dbc-yyyyyyyy-yyyy.cloud.databricks.com
  #     root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
  #   run_as:
  #     service_principal_name: "<service-principal-application-id>"
  #   variables:
  #     catalog: prod_catalog
  #     schema: prod_schema
