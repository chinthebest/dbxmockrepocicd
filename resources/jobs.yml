resources:
  jobs:

    # Runs ddl/*.sql then seed/*.sql. Run on demand, not on every deploy.
    setup_serverless:
      name: setup_serverless_${bundle.target}
      tasks:
        - task_key: ddl
          environment_key: default
          spark_python_task:
            python_file: ../jobs/run_sql.py
            parameters: ["--folder", "ddl", "--catalog", "${var.catalog}", "--schema", "${var.schema}"]
        - task_key: seed
          depends_on:
            - task_key: ddl
          environment_key: default
          spark_python_task:
            python_file: ../jobs/run_sql.py
            parameters: ["--folder", "seed", "--catalog", "${var.catalog}", "--schema", "${var.schema}"]
      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies:
              - -r ${workspace.file_path}/requirements-cluster.txt

    # Regular pipeline: one task per entity
    entity_serverless:
      name: entity_serverless_${bundle.target}
      tasks:
        - task_key: customer
          environment_key: default
          spark_python_task:
            python_file: ../jobs/run_entity.py
            parameters: ["--entity", "customer", "--catalog", "${var.catalog}", "--schema", "${var.schema}"]
        - task_key: order
          depends_on:
            - task_key: customer
          environment_key: default
          spark_python_task:
            python_file: ../jobs/run_entity.py
            parameters: ["--entity", "order", "--catalog", "${var.catalog}", "--schema", "${var.schema}"]
      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies:
              - -r ${workspace.file_path}/requirements-cluster.txt
      # schedule:
      #   quartz_cron_expression: "0 0 6 * * ?"
      #   timezone_id: UTC

    # On-demand: databricks bundle run restatement_serverless -t dev
    restatement_serverless:
      name: restatement_serverless_${bundle.target}
      parameters:
        - name: start_date
          default: "2024-01-01"
        - name: end_date
          default: "2024-01-31"
      tasks:
        - task_key: restatement
          environment_key: default
          spark_python_task:
            python_file: ../jobs/restatement.py
            parameters:
              - "--entity"
              - "order"
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "${var.schema}"
              - "--start-date"
              - "{{job.parameters.start_date}}"
              - "--end-date"
              - "{{job.parameters.end_date}}"
      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies:
              - -r ${workspace.file_path}/requirements-cluster.txt

